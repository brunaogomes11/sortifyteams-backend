<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite — Sortify Teams</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#0C0F0A] text-[#EEF2E4] flex items-center justify-center p-6">
    <div class="w-full max-w-sm text-center">
        <h1 class="text-2xl font-extrabold uppercase tracking-tight text-[#FBFDF4]">
            Sortify <span class="text-[#C7FA3C]">Teams</span>
        </h1>

        <p th:if="${!racha.aberto}"
           class="mt-6 rounded-lg border border-[#5A3A3A] bg-[#2A1414] px-4 py-3 text-sm font-bold text-[#F4A6A6]">
            Este racha não está mais aberto — foi cancelado ou já aconteceu.
        </p>

        <p class="mt-6 mb-1 text-xs font-bold uppercase tracking-widest text-[#C7FA3C]"
           th:text="${racha.organizador} + ' te chamou pro racha!'">Organizador te chamou!</p>

        <div class="mt-4 rounded-2xl border border-[#2C3421] bg-[#12160F] p-6">
            <div class="text-4xl" th:text="${racha.esporteIcone}">⚽</div>
            <h2 class="mt-2 text-2xl font-extrabold text-[#FBFDF4]" th:text="${racha.esporteNome}">Futebol</h2>
            <p th:if="${racha.local}" class="mt-1 text-sm text-[#A9B39A]" th:text="'📍 ' + ${racha.local}"></p>
            <p class="mt-3 text-sm text-[#A9B39A]">
                <span th:text="${racha.qtdParticipantes} + ' na lista'">0 na lista</span>
                <span th:if="${racha.limiteVagas != null}" th:text="' · ' + ${racha.limiteVagas} + ' vagas'"></span>
            </p>
            <p th:if="${!racha.quando.isEmpty()}" class="text-sm text-[#A9B39A]" th:text="${racha.quando}"></p>
        </div>

        <a th:href="${deepLink}" id="abrir"
           class="mt-6 block w-full rounded-lg bg-[#C7FA3C] py-3 font-bold text-[#0C1400] hover:bg-[#AEE81C] transition">
            Abrir no app
        </a>

        <p class="mt-5 text-xs text-[#6F7A61]">Não tem o app? Instale para entrar no racha.</p>
        <div class="mt-3 flex gap-4 justify-center">
            <a href="#" class="text-sm text-[#A9B39A] underline hover:text-[#EEF2E4]">Google Play</a>
            <a href="#" class="text-sm text-[#A9B39A] underline hover:text-[#EEF2E4]">App Store</a>
        </div>
    </div>

    <script th:if="${racha.aberto}" th:inline="javascript">
        // Tenta abrir o app assim que a página carrega: com o app instalado, o SO
        // captura o esquema racha:// e troca pro app. Sem o app, o esquema não
        // resolve e esta página permanece como fallback. Racha fechado não
        // redireciona — o convidado precisa ver o aviso.
        const deepLink = /*[[${deepLink}]]*/ 'racha://convite/';
        window.location.href = deepLink;
    </script>
</body>
</html>
