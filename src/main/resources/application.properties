spring.application.name=sortifyteams

spring.config.import=optional:file:.env[.properties]

# Honra X-Forwarded-* do proxy (gera https:// nas URLs atras de TLS termination)
server.forward-headers-strategy=framework

# URL base publica usada para montar links de arquivos/recursos.
# Vazio = detecta a partir da requisicao. Em producao defina APP_BASE_URL.
app.base-url=${APP_BASE_URL:}

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Sessao (painel admin) — Spring Session JDBC cria o proprio schema
spring.session.jdbc.initialize-schema=always

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# JWT — access token de vida curta (15 min). Refresh token renova silenciosamente.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Refresh token (opaco, rotativo, persistido) — 30 dias por padrao
app.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:2592000000}

# Armazenamento de fotos (StorageService). MVP: disco local.
app.storage.local-path=${STORAGE_PATH:uploads}

# Deep link do app (convite de racha — C9)
app.deep-link-base=${APP_DEEP_LINK_BASE:racha://convite}

# Upload de fotos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Admin do painel (/admin) — criado no startup se nao existir (AdminSeeder)
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@racha.local}

# Expo Push Service (D5)
app.expo.push-url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
