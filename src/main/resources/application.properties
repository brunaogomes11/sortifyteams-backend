spring.application.name=sortifyteams

spring.config.import=optional:file:.env[.properties]

# Honra X-Forwarded-* do proxy (gera https:// nas URLs atras de TLS termination)
server.forward-headers-strategy=framework

# URL base publica usada para montar links de arquivos/recursos.
# Vazio = detecta a partir da requisicao. Em producao defina APP_BASE_URL.
app.base-url=${APP_BASE_URL:}

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Sessao (painel admin) — Spring Session JDBC cria o proprio schema
spring.session.jdbc.initialize-schema=always

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# JWT — access token de vida curta (15 min). Refresh token renova silenciosamente.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Refresh token (opaco, rotativo, persistido) — 30 dias por padrao
app.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:2592000000}

# Armazenamento de fotos (StorageService). MVP: disco local.
app.storage.local-path=${STORAGE_PATH:uploads}

# Deep link do app (convite de racha — C9)
app.deep-link-base=${APP_DEEP_LINK_BASE:racha://convite}

# Upload de fotos e do APK (spec 002, T001). O APK atual tem ~30 MB; a folga
# cobre crescimento sem exigir redeploy so para publicar uma versao maior.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:150MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:160MB}

# Admin do painel (/admin) — criado no startup se nao existir (AdminSeeder)
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@racha.local}

# Expo Push Service (D5)
app.expo.push-url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}

# Geocodificacao de enderecos (OpenStreetMap Nominatim — gratuito).
# Politica do Nominatim: User-Agent identificavel e ~1 req/s. Desligue em testes.
app.geocoding.enabled=${GEOCODING_ENABLED:true}
app.geocoding.url=${GEOCODING_URL:https://nominatim.openstreetmap.org/search}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:SortifyTeams/1.0 (contato@sortifyteams.app)}

# Expiracao diaria de rachas ABERTOS com data vencida (viram CANCELADO). Padrao: 3h15.
app.racha.expiracao-cron=${RACHA_EXPIRACAO_CRON:0 15 3 * * *}

# --- Atualizacao do app (spec 002) ---
# Expurgo dos binarios antigos (C23). Cron DIARIO que filtra por idade -- nao
# use fixedDelay: a contagem reinicia a cada restart e o job nunca dispararia.
app.versao.expurgo-cron=${VERSAO_EXPURGO_CRON:0 40 3 * * *}
app.versao.retencao-dias=${VERSAO_RETENCAO_DIAS:30}
# Import unico do APK distribuido antes da spec 002 (T006). So roda quando nao
# ha nenhuma versao publicada. Vazio desliga.
app.versao.apk-inicial=${APK_INICIAL:classpath:static/downloads/sortify-teams-v1.0.0.apk}
app.versao.apk-inicial-versao=${APK_INICIAL_VERSAO:1.0.0}
app.versao.apk-inicial-version-code=${APK_INICIAL_VERSION_CODE:1}
app.versao.apk-inicial-runtime=${APK_INICIAL_RUNTIME:1}

# Porta do servidor
server.port=${SERVER_PORT:8083}
